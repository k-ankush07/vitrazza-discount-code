api_version = "2026-07"

[[extensions]]
# Change the merchant-facing name of the extension in locales/en.default.json
name = "t:name"
handle = "discount-settings"
uid = "4153cfee-486d-4b15-928f-4528c0dc316574c5e34d"
type = "ui_extension"
description = "t:description"

[[extensions.targeting]]
module = "./src/DiscountSettings.jsx"
target = "admin.discount-details.function-settings.render"

# The admin requires this declaration to render function settings, even though
# this UI is read-only and never writes the metafield.
[[extensions.metafields]]
namespace = "$app"
key = "function-configuration"
